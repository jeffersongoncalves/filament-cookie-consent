# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).
# One entry per ecosystem for every version branch; Dependabot reads this file from the default branch only.

version: 2

updates:

  # ---------- 1.x ----------

  - package-ecosystem: github-actions
    directory: /
    target-branch: 1.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    target-branch: 1.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: jeffersongoncalves/filament-analytics-core
        versions:
          - '>=2.0'
    groups:
      composer-deps:
        patterns:
          - '*'

  # ---------- 2.x ----------

  - package-ecosystem: github-actions
    directory: /
    target-branch: 2.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    target-branch: 2.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: jeffersongoncalves/filament-analytics-core
        versions:
          - '>=3.0'
    groups:
      composer-deps:
        patterns:
          - '*'

  # ---------- 3.x ----------

  - package-ecosystem: github-actions
    directory: /
    target-branch: 3.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    target-branch: 3.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: jeffersongoncalves/filament-analytics-core
        versions:
          - '>=4.0'
    groups:
      composer-deps:
        patterns:
          - '*'
